services:
  postgres:
    image: postgres:16-alpine
    container_name: playlisthome_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-playlist_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playlist_pass}
      POSTGRES_DB: ${POSTGRES_DB:-playlist_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-playlist_user} -d ${POSTGRES_DB:-playlist_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: playlisthome_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-playlist_user}:${POSTGRES_PASSWORD:-playlist_pass}@postgres:5432/${POSTGRES_DB:-playlist_db}?sslmode=disable
      PORT: 8080
      ENV: development
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_please}
      # YouTube / Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:3000/auth/google/callback}
      # Spotify OAuth
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URL: ${SPOTIFY_REDIRECT_URL:-http://localhost:3000/auth/spotify/callback}
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: playlisthome_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"

volumes:
  postgres_data:
